{id:3,name:"Carolina",titulo:"¡La alimentación se ha convertido en un conflicto!",

function buildGrid(words,seed){
 const N=12;let s=seed*9301+49297;const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
 const g=Array.from({length:N},()=>Array(N).fill(""));const D=[[0,1],[1,0],[1,1],[-1,1]];
 words.forEach(w=>{const W=norm(w);for(let t=0;t<400;t++){
  const d=D[Math.floor(rnd()*4)],r=Math.floor(rnd()*N),c=Math.floor(rnd()*N);
  const er=r+d[0]*(W.length-1),ec=c+d[1]*(W.length-1);
  if(er<0||er>=N||ec<0||ec>=N)continue;
  let ok=true;for(let i=0;i<W.length;i++){const x=g[r+d[0]*i][c+d[1]*i];if(x&&x!==W[i]){ok=false;break}}
  if(!ok)continue;for(let i=0;i<W.length;i++)g[r+d[0]*i][c+d[1]*i]=W[i];break}});
 const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";return g.map(r=>r.map(x=>x||A[Math.floor(rnd()*26)]));
}

 <div class="mt-6 grid gap-1 mx-auto max-w-md" style=${{gridTemplateColumns:"repeat(12,minmax(0,1fr))"}}>${grid.flat().map((c,i)=>html`<div key=${i} class="aspect-square flex items-center justify-center rounded bg-emerald-50 text-emerald-900 text-xs sm:text-base font-semibold">${c}</div>`)}</div>

 <div class="mt-8 flex sm:justify-end"><${Btn} disabled=${!ok.every(Boolean)} onClick=${onDone}>Pasar al siguiente desafío<//></div><//>`}

function Gate({next,onOk}){
 const [v,setV]=useState("");const [err,setErr]=useState(false);
 const go=()=>v.trim()===CLAVE?onOk():setErr(true);
 return html`<${Card}><${H}>Acceso al ${next}<//>
 <p class="mt-2 text-slate-600">Solicita la contraseña al docente e ingrésala para continuar.</p>
 <input class=${inp+" mt-6 max-w-sm"} value=${v} placeholder="Contraseña" onInput=${e=>{setV(e.target.value);setErr(false)}} onKeyDown=${e=>e.key==="Enter"&&go()}/>
 ${err&&html`<p class="mt-2 text-sm text-red-700">Contraseña incorrecta. Verifica con el docente.</p>`}
 <div class="mt-6"><${Btn} disabled=${!v.trim()} onClick=${go}>Comprobar<//></div><//>`}

function Ch2({caso,onSend}){
 const [a,setA]=useState("");
 return html`<${Card}><${H}>Desafío 2<//>
 <p class="mt-2 text-slate-600">Herramientas del desafío anterior:</p>
 <div class="mt-3 flex flex-wrap gap-2">${caso.palabras.map(w=>html`<span key=${w.p} class="rounded-full bg-emerald-100 px-4 py-1.5 text-sm font-semibold text-emerald-900">${w.p.charAt(0)+w.p.slice(1).toLowerCase()}</span>`)}</div>
 <p class="mt-6 text-lg font-semibold text-slate-800">${caso.d2q}</p>
 <textarea rows="7" class=${inp+" mt-4"} placeholder="Escribe la respuesta del grupo" value=${a} onInput=${e=>setA(e.target.value)}></textarea>
 <div class="mt-6 flex sm:justify-end"><${Btn} disabled=${!a.trim()} onClick=${()=>onSend([{q:caso.d2q,a:a.trim()}])}>Enviar respuesta<//></div><//>`}

function Ch3({caso,onSend}){
 const [a,setA]=useState(["","",""]);
 const L="ABCDEFGHIJKLMNOPQRSTUVWXYZ";const rows=Array.from({length:13},(_,i)=>[L[i],i+1,L[i+13],i+14]);
 const full=a.every(x=>x.trim());
 return html`<${Card}><${H}>Desafío 3 · Mensaje secreto<//>
 ${caso.d3i&&html`<p class="mt-3 text-slate-700">${caso.d3i}</p>`}
 <div class="mt-5 overflow-x-auto"><table class="w-full max-w-lg mx-auto text-center border-collapse"><thead><tr class="bg-emerald-800 text-white">${["Letra","Número","Letra","Número"].map((t,i)=>html`<th key=${i} class="py-2 px-3 text-sm font-semibold">${t}</th>`)}</tr></thead>
 <tbody>${rows.map((r,i)=>html`<tr key=${i} class=${i%2?"bg-emerald-50":"bg-white"}>${r.map((c,j)=>html`<td key=${j} class=${"py-1.5 px-3 border-b border-emerald-100 "+(j%2?"text-slate-600":"font-bold text-emerald-900")}>${c}</td>`)}</tr>`)}</tbody></table></div>
 <div class="mt-6 rounded-xl border-2 border-amber-300 bg-amber-100 p-5 text-center font-mono text-lg sm:text-2xl tracking-widest text-amber-900 break-words">${caso.codigo||"[código por definir]"}</div>
 <p class="mt-4 text-slate-700">Cada número es una letra y cada símbolo / indica que comienza una nueva palabra.</p>
 <h3 class="mt-8 text-xl font-bold text-emerald-900">Segunda misión</h3>
 <div class="mt-3 grid gap-4">${caso.misiones.map((q,i)=>html`<div key=${i}><label class="block font-semibold text-slate-800">${i+1}. ${q}</label>
  <textarea rows="3" class=${inp+" mt-2"} value=${a[i]} onInput=${e=>setA(a.map((x,k)=>k===i?e.target.value:x))}></textarea></div>`)}</div>
 ${!full&&html`<p class="mt-3 text-sm text-slate-500">Completa las tres respuestas para poder enviar.</p>`}
 <div class="mt-6 flex sm:justify-end"><${Btn} disabled=${!full} onClick=${()=>onSend(caso.misiones.map((q,i)=>({q,a:a[i].trim()})))}>Enviar respuestas<//></div><//>`}

const Bub=({who,name,children})=>html`<div class=${"flex "+(who==="M"?"justify-end":"justify-start")}><div class=${"max-w-[90%] rounded-2xl px-4 py-3 shadow-sm border "+(who==="M"?"bg-amber-50 border-amber-200 rounded-br-sm":"bg-emerald-50 border-emerald-200 rounded-bl-sm")}><p class=${"mb-1 text-xs font-bold uppercase tracking-wider "+(who==="M"?"text-amber-800":"text-emerald-800")}>${who==="M"?(name||"Paciente"):"Nutricionista"}</p><p class="text-slate-800">${children}</p></div></div>`;

function Ch4({caso,onSend}){
 const DLG=caso.dlg;
 const [e,setE]=useState({});const [x,setX]=useState("");
 const ns=DLG.map((d,i)=>[d,i]).filter(([d])=>d[0]==="N");
 const set=(i,k,v)=>setE({...e,[i]:{...e[i],[k]:v}});
 const full=ns.every(([,i])=>e[i]&&e[i].ok&&(e[i].t||"").trim())&&x.trim();
 const q=i=>e[i].ok==="Sí"?"¿Por qué?":"¿Cómo lo mejorarías?";
 return html`<${Card}><${H}>Desafío 4. La consulta incompleta: ¡Encuentra lo que falta!<//>
 <p class="mt-3 text-slate-700">${caso.d4i}</p>
 <div class="mt-6 grid gap-4 rounded-2xl border border-slate-200 bg-slate-50 p-4 sm:p-6">${DLG.map(([w,t],i)=>html`<div key=${i} class="grid gap-3"><${Bub} who=${w} name=${caso.name}>${t}<//>
  ${w==="N"&&html`<div class="rounded-xl border border-slate-200 bg-white p-4"><p class="font-semibold text-slate-800">¿Crees que esto está correcto?</p>
   <div class="mt-3 flex gap-3">${["Sí","No"].map(o=>html`<button key=${o} onClick=${()=>set(i,"ok",o)} class=${"flex-1 sm:flex-none sm:w-32 rounded-xl border px-5 py-3 font-semibold transition "+(e[i]&&e[i].ok===o?"border-emerald-700 bg-emerald-700 text-white":"border-emerald-300 bg-white text-emerald-800 hover:bg-emerald-50")}>${o}</button>`)}</div>
   ${e[i]&&e[i].ok&&html`<div class="fade mt-3"><label class="block text-sm font-semibold text-slate-700">${q(i)}</label><textarea rows="3" class=${inp+" mt-2"} value=${e[i].t||""} onInput=${ev=>set(i,"t",ev.target.value)}></textarea></div>`}</div>`}</div>`)}</div>
 <label class="mt-8 block text-lg font-semibold text-slate-800">Expliquen qué información importante no está explorando el nutricionista.</label>
 <textarea rows="4" class=${inp+" mt-2"} value=${x} onInput=${ev=>setX(ev.target.value)}></textarea>
 ${!full&&html`<p class="mt-3 text-sm text-slate-500">Responde todas las intervenciones del nutricionista y la pregunta final para poder enviar.</p>`}
 <div class="mt-6 flex sm:justify-end"><${Btn} disabled=${!full} onClick=${()=>onSend(ns.map(([d,i],k)=>({q:"Intervención "+(k+1)+" del nutricionista: «"+d[1]+"» · ¿Correcta? "+e[i].ok+" · "+q(i),a:e[i].t.trim()})).concat([{q:"¿Qué información importante no está explorando el nutricionista?",a:x.trim()}]))}>Enviar respuestas<//></div><//>`}

function Quiz({title,intro,bubs,mid,head,note,qs,name,onSend}){
 const [a,setA]=useState(qs.map(()=>""));const full=a.every(x=>x.trim());
 return html`<${Card}><${H}>${title}<//>
 ${intro&&html`<p class="mt-3 text-slate-700">${intro}</p>`}
 ${bubs&&bubs.length>0&&html`<div class="mt-5 grid gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 sm:p-6">${bubs.map((t,i)=>html`<${Bub} key=${i} who="M" name=${name}>${t}<//>`)}</div>`}
 ${mid&&html`<p class="mt-5 rounded-xl border-l-4 border-amber-400 bg-amber-50 p-4 text-slate-800">${mid}</p>`}
 ${head&&html`<h3 class="mt-8 text-xl font-bold text-emerald-900">${head}</h3>`}
 ${note&&html`<div class="mt-4 rounded-xl border-2 border-emerald-600 bg-emerald-50 p-4 text-emerald-900">${note.map((n,i)=>html`<p key=${i} class=${i?"mt-1 text-sm":"font-semibold"}>${n}</p>`)}</div>`}
 <div class="mt-5 grid gap-5">${qs.map((q,i)=>html`<div key=${i}><label class="block font-semibold text-slate-800">${i+1}. ${q}</label>
  <textarea rows="4" class=${inp+" mt-2"} value=${a[i]} onInput=${e=>setA(a.map((x,k)=>k===i?e.target.value:x))}></textarea></div>`)}</div>
 ${!full&&html`<p class="mt-3 text-sm text-slate-500">Completa todas las respuestas para poder enviar.</p>`}
 <div class="mt-6 flex sm:justify-end"><${Btn} disabled=${!full} onClick=${()=>onSend(qs.map((q,i)=>({q,a:a[i].trim()})))}>Enviar respuestas<//></div><//>`}

const Fin=({onHome})=>html`<${Card}><${H}>¡Han completado todos los desafíos!<//><p class="mt-3 text-slate-700">Su última respuesta fue enviada al docente. Gracias por el trabajo del equipo nutricional.</p><div class="mt-6"><${Btn} v="s" onClick=${onHome}>Volver al inicio<//></div><//>`;

function Panel({subs,db,onVerify,onClear,onExit}){
 const [confirm,setConfirm]=useState(false);const [toast,setToast]=useState(false);
 const pend=subs.filter(s=>s.estado==="pendiente").length;const prev=useRef(pend);
 useEffect(()=>{if(pend>prev.current){setToast(true);setTimeout(()=>setToast(false),6000)}prev.current=pend},[pend]);
 const list=[...subs].sort((x,y)=>y.ts-x.ts);
 return html`<${Card}><div class="flex flex-wrap items-center justify-between gap-3"><${H}>Panel de control<//>
 <span class=${"rounded-full px-4 py-1.5 text-sm font-semibold "+(pend?"bg-amber-100 text-amber-900":"bg-emerald-100 text-emerald-900")}>${pend} por verificar</span></div>
 ${toast&&html`<div class="fade mt-4 rounded-xl bg-amber-100 border border-amber-300 p-3 text-amber-900 font-semibold">Nueva respuesta recibida. Verifícala para entregar la clave.</div>`}
 ${!db&&html`<p class="mt-3 text-sm text-slate-500">Modo local: solo se ven los envíos hechos en este mismo navegador.</p>`}
 <p class="mt-3 text-slate-600">Clave para avanzar de desafío: <span class="font-mono font-bold text-emerald-900">${CLAVE}</span></p>
 <div class="mt-6 grid gap-4">${list.length===0&&html`<p class="text-slate-500">Aún no hay respuestas.</p>`}
 ${list.map(s=>html`<div key=${s.id} class=${"rounded-xl border p-4 "+(s.estado==="pendiente"?"border-amber-300 bg-amber-50":"border-slate-200")}>
  <div class="flex flex-wrap items-center justify-between gap-2"><p class="font-bold text-emerald-900">Grupo ${s.grupo} · Desafío ${s.desafio===6?"final":s.desafio}</p>
  <p class="text-xs text-slate-500">${new Date(s.ts).toLocaleTimeString("es")} · ${s.estado==="pendiente"?"Pendiente":s.estado==="auto"?"Automático":"Verificada"}</p></div>
  ${(s.respuestas||[]).map((r,i)=>html`<div key=${i} class="mt-3"><p class="text-sm font-semibold text-slate-600">${r.q}</p><p class="whitespace-pre-wrap text-slate-800">${r.a}</p></div>`)}
  ${s.estado==="auto"&&html`<p class="mt-2 text-sm text-slate-600">Sopa de letras completada y validada por el sistema.</p>`}
  ${s.estado==="pendiente"&&html`<div class="mt-4"><${Btn} onClick=${()=>onVerify(s.id)}>Marcar como verificada<//></div>`}</div>`)}</div>
 <div class="mt-8 flex flex-col-reverse sm:flex-row sm:justify-between gap-3"><${Btn} v="s" onClick=${onExit}>Salir del panel<//>
 <${Btn} v="s" onClick=${()=>confirm?(onClear(),setConfirm(false)):setConfirm(true)}>${confirm?"Confirmar: borrar todas las respuestas":"Limpiar respuestas"}<//></div><//>`}

function App(){
 const [view,setView]=useState("home");const [caso,setCaso]=useState(null);const [step,setStep]=useState(0);const [ctx,setCtx]=useState(false);const [ready,setReady]=useState(false);
 const [db,setDb]=useState(null);const [subs,setSubs]=useState([]);const [local,setLocal]=useState([]);const [pw,setPw]=useState("");const [pwErr,setPwErr]=useState(false);
 useEffect(()=>{let on=true;(async()=>{try{const d=await getDb();if(on){setDb(d);setReady(true)}}catch(e){}})();return()=>{on=false}},[]);
 useEffect(()=>{if(!db||view!=="panel")return;return db.collection("subs").onSnapshot(s=>setSubs(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{})},[db,view]);
 const send=async(desafio,respuestas,auto)=>{
  const e={grupo:caso.id,desafio,respuestas,estado:auto?"auto":"pendiente",ts:Date.now()};
  if(db){try{await db.collection("subs").add(e);return}catch(x){}}
  setLocal(a=>[...a,{...e,id:"l"+e.ts}]);
 };
 const verify=async id=>{
  if(id.startsWith("l"))return setLocal(a=>a.map(x=>x.id===id?{...x,estado:"verificada"}:x));
  try{await db.doc("subs/"+id).update({estado:"verificada"})}catch(e){}
 };
 const clear=async()=>{setLocal([]);if(db)for(const s of subs){try{await db.doc("subs/"+s.id).delete()}catch(e){}}};
 const home=()=>{setView("home");setCaso(null);setStep(0);setCtx(false)};
 const f=FLOW[step];const all=[...subs,...local];
 const pct=view==="flow"?Math.round(step/(FLOW.length-1)*100):0;
 let body;
 if(view==="home")body=html`<${Home} key="h" onCase=${c=>{setCaso(c);setView("intro")}} onPanel=${()=>{setPw("");setPwErr(false);setView("plogin")}}/>`;
 else if(view==="intro")body=html`<${Intro} key="i" caso=${caso} onBack=${home} onNext=${()=>{setStep(0);setView("flow")}}/>`;
 else if(view==="plogin"){const go=()=>pw.trim()===ADMIN?setView("panel"):setPwErr(true);
  body=html`<${Card} key="pl"><${H}>Acceso del profesor<//><input class=${inp+" mt-6 max-w-sm"} type="password" value=${pw} placeholder="Contraseña" onInput=${e=>{setPw(e.target.value);setPwErr(false)}} onKeyDown=${e=>e.key==="Enter"&&go()}/>
  ${pwErr&&html`<p class="mt-2 text-sm text-red-700">Contraseña incorrecta.</p>`}
  <div class="mt-6 flex flex-col-reverse sm:flex-row gap-3"><${Btn} v="s" onClick=${home}>Volver<//><${Btn} disabled=${!pw.trim()} onClick=${go}>Ingresar<//></div><//>`}
 else if(view==="panel")body=html`<${Panel} key="p" subs=${all} db=${db} onVerify=${verify} onClear=${clear} onExit=${home}/>`;
 else if(f==="c1")body=html`<${Ch1} key="c1" caso=${caso} onDone=${()=>{send(1,[],true);setStep(1)}}/>`;
 else if(["g1","g2","g3","g4","g5"].includes(f))body=html`<${Gate} key=${f} next=${f==="g5"?"Desafío final":"Desafío "+(step/2+1.5|0)} onOk=${()=>setStep(step+1)}/>`;
 else if(f==="c2")body=html`<${Ch2} key="c2" caso=${caso} onSend=${r=>{send(2,r);setStep(3)}}/>`;
 else if(f==="c3")body=html`<${Ch3} key="c3" caso=${caso} onSend=${r=>{send(3,r);setStep(5)}}/>`;
 else if(f==="c4")body=html`<${Ch4} key="c4" caso=${caso} onSend=${r=>{send(4,r);setStep(7)}}/>`;
 else if(f==="c5")body=html`<${Quiz} key="c5" ...${caso.d5} name=${caso.name} title="Desafío 5. ¡Alerta nutricional: la consulta se complica!" head="Misión: ¡Resuelve la alerta nutricional!" onSend=${r=>{send(5,r);setStep(9)}}/>`;
 else if(f==="c6")body=html`<${Quiz} key="c6" ...${caso.d6} name=${caso.name} title="Desafío final. ¡La última misión: recupera la confianza!" onSend=${r=>{send(6,r);setStep(11)}}/>`;
 else body=html`<${Fin} key="fin" onHome=${home}/>`;
 return html`<div class="mx-auto max-w-3xl px-4 py-6 sm:py-12">
  <div class="mb-5 flex items-center justify-between"><span class="text-sm font-bold uppercase tracking-wider text-emerald-800">Taller código nutricional</span>
  <div class="flex items-center gap-3">${ready&&html`<span class=${"text-xs font-semibold "+(db?"text-emerald-700":"text-amber-700")}>${db?"● Conectado con el docente":"● Sin conexión con el docente"}</span>`}${caso&&view!=="panel"&&html`<span class="rounded-full bg-emerald-800 px-3 py-1 text-xs font-semibold text-white">Grupo ${caso.id}</span>`}</div></div>
  ${view==="flow"&&html`<div class="mb-5"><div class="mb-1 flex justify-between text-xs text-slate-600"><span>${ETQ[step]}</span><span>${pct}%</span></div>
  <div class="h-2 overflow-hidden rounded-full bg-emerald-100"><div class="h-full rounded-full bg-emerald-600 transition-all duration-500" style=${{width:pct+"%"}}></div></div></div>`}
  ${view==="flow"&&!ctx&&f!=="fin"&&html`<div class="mb-4"><button onClick=${()=>setCtx(true)} class="rounded-xl border border-emerald-300 bg-white px-5 py-3 text-sm font-semibold text-emerald-800 transition hover:bg-emerald-50 hover:shadow-md">← Volver al contexto del caso</button></div>`}
  ${view==="flow"&&ctx&&html`<${Ctx} caso=${caso} onBack=${()=>setCtx(false)}/>`}
  <div class=${view==="flow"&&ctx?"hidden":""}>${body}</div></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script></body></html>
